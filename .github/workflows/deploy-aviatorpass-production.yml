name: Deploy AviatorPass Production

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        # Pin full commit SHA (Semgrep: mutable action tags / supply-chain).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Missing hook on `push` is SKIP (Vercel Git still deploys main).
      # workflow_dispatch still requires VERCEL_AVIATORPASS_DEPLOY_HOOK.
      - name: Trigger production deploy hook
        env:
          VERCEL_AVIATORPASS_DEPLOY_HOOK: ${{ secrets.VERCEL_AVIATORPASS_DEPLOY_HOOK }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/trigger-production-deploy.mjs

      - name: Wait for production health
        run: node scripts/wait-production-health.mjs
